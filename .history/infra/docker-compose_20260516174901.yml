services:
  dl-service:
    build:
      context: ../dl-services
      dockerfile: Dockerfile
    volumes:
      - D:/vqa-models:/app/models:ro
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_CACHE=/app/models
    ports:
      - "8000:8000"
    networks:
      - vqa-net

  server-backend:
    build:
      context: ../server-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DL_SERVICE_URL=http://dl-service:8000
    networks:
      - vqa-net
    depends_on:
      - dl-service

networks:
  vqa-net:
    driver: bridge