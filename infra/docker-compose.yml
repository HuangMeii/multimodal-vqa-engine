services:
  dl-service:
    build:
      context: ../dl-services
      dockerfile: Dockerfile
    container_name: dl-service-1
    volumes:
      - "D:/MyData/Disk D/Thú vui lười biếng/vqa-models/grounding-dino:/app/models/grounding-dino"
      - "D:/MyData/Disk D/Thú vui lười biếng/vqa-models/blip2:/app/models/blip2"
      - "D:/MyData/Disk D/Thú vui lười biếng/vqa-models/qwen:/app/models/qwen"
    environment:
      - HF_HOME=/app/models
    ports:
      - "8000:8000"
    networks:
      - vqa-net

  server-backend:
    build:
      context: ../server-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DL_SERVICE_URL=http://dl-service:8000
    networks:
      - vqa-net
    depends_on:
      - dl-service

networks:
  vqa-net:
    driver: bridge
